name: Sprint 2 e 3 - processamento, painel e integracao
on:
  pull_request:
  push:
    branches: [main, consolidacao-sprint2, estabilizacao-sprint3]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            FrontEnd/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix FrontEnd ci --no-audit --no-fund
      - run: npm test
      - run: npm run test:e2e
      - run: npm --prefix FrontEnd run lint
      - run: npm --prefix FrontEnd run build
      - run: npm run build:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sprint3-validacao-local-sintetica
          path: |
            test-results/
            docs/estabilizacao-sprint3/evidencias/
          retention-days: 14
